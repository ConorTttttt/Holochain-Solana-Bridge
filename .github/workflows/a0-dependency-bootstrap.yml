name: A0 non-authorizing Cargo dependency bootstrap (review proposals ONLY)

on:
  pull_request:
    branches: [agent/ci/11-build-pipeline]
    paths:
      - 'holochain/demo/**'
      - '.github/workflows/a0-dependency-bootstrap.yml'
      - 'scripts/ci/a0-bootstrap-locks.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a0-dependency-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  dependency-proposal:
    name: Preserve reviewed WASM lock and propose missing native HAM lock (NOT a build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Confirm checkout exactly matches immutable event head
        env:
          A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$A0_EXPECTED_SHA"
          test -s holochain/demo/Cargo.toml
          test -s holochain/demo/ham-adapter/Cargo.toml
          test -s holochain/demo/Cargo.lock
          git ls-files --error-unmatch -- holochain/demo/Cargo.lock
          test ! -e holochain/demo/ham-adapter/Cargo.lock
      - name: Install pinned Rust only (NOT Nix, Lair or a conductor)
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 -Vv
      - name: Preserve reviewed WASM graph and propose native HAM lock without executing code
        env:
          A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          bash -n scripts/ci/a0-bootstrap-locks.sh
          bash scripts/ci/a0-bootstrap-locks.sh 2>&1 | tee ci-artifacts/a0-bootstrap-resolution.log
      - name: Always retain generated lockfile proposals, first failing command and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a0-unreviewed-lock-proposals-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-artifacts/a0-bootstrap-*
            holochain/demo/Cargo.lock
            holochain/demo/ham-adapter/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
