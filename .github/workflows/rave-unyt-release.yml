name: RAVE Unyt v0.117.0 release proof (non-economic)

on:
  push:
    branches: [agent/rave/9-rave-validation, integration/s0/11-all-agent-snapshot, integration/s0/2026-11-14-agent1-candidate, integration/s0/2026-11-14-sol38-review-pending, integration/demo/2026-11-14-a1-rave5-required-review, integration/demo/2026-11-14-a1-a0-evidence-gated, integration/demo/2026-11-14-a1-bootstrap-source-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rave-unyt-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-integrity:
    name: Verify Unyt hApp/DNA signature and hashes (NOT deployed)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert exact branch revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p ci-artifacts
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/source-commit.sha
      - name: Install minisign on disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          command -v minisign
      - name: Download and cryptographically verify exact release bytes
        run: |
          set -euo pipefail
          bash tests/holochain/sandbox/verify-unyt-release.sh "$PWD/ci-artifacts/verified-release" 2>&1 | tee ci-artifacts/release-verification.log
          (cd ci-artifacts/verified-release && sha256sum unyt.happ alliance.dna SHA256SUMS SHA256SUMS.minisig) | tee ci-artifacts/release-sha256.log
          (cd ci-artifacts/verified-release && wc -c unyt.happ alliance.dna SHA256SUMS SHA256SUMS.minisig) | tee ci-artifacts/release-bytes.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rave-unyt-release-bytes-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  compatible-cli-bundle-inspection:
    name: Unpack verified hApp/DNA with Holonix 0.7.1 (NOT conductor test)
    needs: release-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert exact branch revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p ci-artifacts
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/source-commit.sha
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rave-unyt-release-bytes-${{ github.sha }}
          path: ci-artifacts/
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
      - name: Inspect with commit-pinned Holonix main-0.7 environment
        run: |
          set -euo pipefail
          nix --version | tee ci-artifacts/nix-version.log
          nix develop 'github:holochain/holonix/a6cdfbd31afd2094b7ccc9b3bd7cf9442ec055da' --command \
            bash tests/holochain/sandbox/inspect-verified-unyt.sh \
            "$PWD/ci-artifacts/verified-release" "$PWD/ci-artifacts/hc-inspection" \
            2>&1 | tee ci-artifacts/hc-inspection.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rave-unyt-hc-inventory-${{ github.sha }}
          path: |
            ci-artifacts/source-commit.sha
            ci-artifacts/nix-version.log
            ci-artifacts/hc-inspection.log
            ci-artifacts/hc-inspection/
          if-no-files-found: warn
          retention-days: 14

  published-rave-host-tests:
    name: Verified published RAVE 0.15.0 Rust host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact source revision and pinned Rust
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/source-commit.sha
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version | tee ci-artifacts/rust-version.log
      - name: Published crate download SHA and locked native regression suite
        run: |
          set -euo pipefail
          bash tests/holochain/rave-engine/verify-crate.sh 2>&1 | tee ci-artifacts/rave-crate-verification.log
          cargo +1.95.0 test --locked --manifest-path tests/holochain/rave-engine/Cargo.toml --all-targets -- --nocapture 2>&1 | tee ci-artifacts/rave-host-tests.log
          sha256sum tests/holochain/rave-engine/Cargo.lock | tee ci-artifacts/rave-cargo-lock.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rave-unyt-host-tests-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  actual-non-economic-conductor-probe:
    name: Actual disposable Unyt conductor install/restart (NO zome economics)
    needs: [release-integrity, compatible-cli-bundle-inspection]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert exact branch revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p ci-artifacts
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/source-commit.sha
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rave-unyt-release-bytes-${{ github.sha }}
          path: ci-artifacts/
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
      - name: Install/restart real sandbox with read-only admin queries
        run: |
          set -euo pipefail
          nix --version | tee ci-artifacts/conductor-nix-version.log
          nix develop 'github:holochain/holonix/a6cdfbd31afd2094b7ccc9b3bd7cf9442ec055da' --command \
            bash tests/holochain/sandbox/probe-verified-unyt-conductor.sh \
            "$PWD/ci-artifacts/verified-release" "$PWD/ci-artifacts/conductor-audit" \
            2>&1 | tee ci-artifacts/conductor-probe.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rave-unyt-conductor-audit-${{ github.sha }}
          path: |
            ci-artifacts/source-commit.sha
            ci-artifacts/conductor-nix-version.log
            ci-artifacts/conductor-probe.log
            ci-artifacts/conductor-audit/logs/
          if-no-files-found: warn
          retention-days: 14

  non-economic-shadow-contract-tests:
    name: Test-only OBS/Holochain shadow identity and replay gates (NO credit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run checked-in non-economic shadow contract regressions
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/source-commit.sha
          node --version | tee ci-artifacts/shadow-node-version.log
          node --test tests/holochain/*.test.mjs 2>&1 | tee ci-artifacts/shadow-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rave-unyt-shadow-tests-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
