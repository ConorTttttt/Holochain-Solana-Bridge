name: S0 cross-agent integration snapshot (NOT production)

on:
  pull_request:
    branches: [agent/ci/11-build-pipeline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The PR event freezes a source SHA. Do not cancel expensive validator jobs
  # if a developer pushes another snapshot before this one finishes.
  group: s0-integration-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  cross-lane-js:
    needs: [solana-lifecycle]
    if: always()
    name: Required SOL layout / SEC adversarial / RAVE shadow fixtures (real SDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Never test an automatically advanced PR merge ref as an alleged frozen snapshot.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Assert immutable source snapshot and record the checkout SHA
        run: |
          mkdir -p ci-artifacts
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$actual" | tee ci-artifacts/source-commit.sha
          test -s ci-integration-snapshot.json
          node -e 'const m=require("./ci-integration-snapshot.json"); if(!m.sources?.SOL || !m.sources?.OBS || !m.sources?.SEC || !m.sources?.RAVE)process.exit(1); console.log(JSON.stringify(m.sources))'
      - name: Verify frozen specialist blob provenance and four dependency locks
        run: bash scripts/ci/record.sh integration-source-provenance node scripts/ci/verify-integration-provenance.mjs
      - name: Install actual Observer and Solana Node dependencies and record lock graph
        run: |
          bash scripts/ci/record.sh observer-deps bash scripts/ci/install-node-deps.sh observer
          bash scripts/ci/record.sh solana-deps bash scripts/ci/install-node-deps.sh tests/solana
      - name: Check demo source-only contract (synthetic denials; NOT a Holochain write)
        run: |
          node --check demo/observation-contract.mjs
          node --check demo/observation-contract.test.mjs
          bash scripts/ci/record.sh demo-contract-denials node --test demo/observation-contract.test.mjs
      - name: Test A0 SHA binding and refusal to promote audit-only file inventory
        run: |
          node --check demo/a0-evidence-summary.mjs
          node --check demo/a0-evidence-summary.test.mjs
          bash scripts/ci/record.sh demo-a0-failclosed node --test demo/a0-evidence-summary.test.mjs
      # IDL checks are REQUIRED: use genuine build output from the validator job,
      # never a synthetic/fabricated IDL. On missing artifacts, continue to the
      # strict cross-lane runner which reports the IDL skip as FAILURE.
      - name: Retrieve generated Anchor IDL from real localnet build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: integration-localnet-evidence-NO-KEYS
          path: .
      - name: Verify genuine compiler artifacts and Anchor IDL against disposable program ID
        run: |
          set -euo pipefail
          test -s target/deploy/deposit_prototype.so
          test -s target/idl/deposit_prototype.json
          test -s target/localnet-evidence/program-id.txt
          readelf -h target/deploy/deposit_prototype.so | grep -E 'Machine:.*(Linux BPF|BPF)'
          trusted_id="$(cat target/localnet-evidence/program-id.txt)"
          bash scripts/ci/record.sh generated-idl-contract node observer/scripts/verify-idl.mjs target/idl/deposit_prototype.json "$trusted_id"
      - name: Execute all offline cross-lane suites; never accept hidden skips
        run: bash scripts/ci/record.sh cross-lane-suites node scripts/ci/run-cross-lane-tests.mjs
      # The downstream job checks ORIGINAL archives from this same workflow's
      # SOL producer. The SOL source verifier binds every mode to git HEAD,
      # generated IDL, compiled SBPF and disposable-validator genesis; fail
      # when ANY required scenario or public snapshot was not uploaded.
      - name: Reject incomplete public evidence download, wrong source SHA or tampered uploaded files
        run: |
          set -euo pipefail
          test -s target/localnet-evidence/source-commit.txt
          test "$(cat target/localnet-evidence/source-commit.txt)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -s target/localnet-evidence/evidence-manifest.sha256
          (cd target/localnet-evidence && sha256sum -c evidence-manifest.sha256)
      - name: Validate and replay SOL-owned original Anchor keys sync patch into disposable checkout only
        run: |
          set -euo pipefail
          bash scripts/ci/record.sh original-post-sync-anchor-source node scripts/ci/a0-replay-source-patch.mjs
      - name: Require complete exact-SHA-bound real validator witness bundles
        run: |
          set -euo pipefail
          for scenario in lifecycle init-capture u64-max demo-domain; do
            bash scripts/ci/record.sh "producer-witness-${scenario}" node tests/solana/verify-witness-bundle.mjs "$scenario"
          done
          bash scripts/ci/record.sh source-domain-identity node tests/solana/verify-demo-domain.mjs
          bash scripts/ci/record.sh source-domain-tamper node tests/solana/verify-demo-domain-tamper.mjs
      - name: Require complete 54-transaction finalized witness inventory and independently checked tamper denials
        run: |
          set -euo pipefail
          bash scripts/ci/record.sh count-original-signed-witnesses node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const expected={"lifecycle":[17,28],"init-capture":[2,2],"u64-max":[3,2]};
            let total=0;
            for(const [mode,[accepted,rejected]] of Object.entries(expected)){
              const index=JSON.parse(readFileSync("target/localnet-evidence/sprint1-"+mode+"-transactions.json","utf8"));
              assert.equal(index.complete,true,mode+" incomplete");
              const actualOk=index.finalized.filter(x=>x.meta?.err===null).length;
              const actualBad=index.finalized.filter(x=>x.meta?.err!==null).length;
              assert.deepEqual([actualOk,actualBad],[accepted,rejected],mode+" 54-witness distribution drift");
              total+=index.finalized.length;
            }
            assert.equal(total,54,"not exactly 54 authentic finalized indexed witness records");
            console.log("PASS: exactly 54 original finalized records in three scenarios");
          '
          for scenario in lifecycle init-capture u64-max; do
            bash scripts/ci/record.sh "consumer-tamper-$scenario" node tests/solana/verify-witness-tamper.mjs "$scenario"
          done
      - name: Require original public Solana RPC transaction/block/account witnesses
        run: bash scripts/ci/record.sh real-rpc-fixture-coherence node --test tests/integration/s0-public-rpc-fixtures.test.mjs
      - name: Verify genuine signed wire bytes and replay finalized blocks through Observer
        run: bash scripts/ci/record.sh real-signed-wire-observer node --test observer/ci/s0-signed-wire-evidence.mjs
      - name: Require real Kit-reviewed source-rich v2 pending queue and explicit NO-ACK
        run: |
          set -euo pipefail
          test -s ci-artifacts/observer-reviewed-v2-original-signed-localnet.json
          test -s ci-artifacts/observer-reviewed-v2-original-signed-localnet.json.sha256
          (cd ci-artifacts && sha256sum --check observer-reviewed-v2-original-signed-localnet.json.sha256)
          node scripts/ci/a0-verify-reviewed-v2.mjs
      - name: Require fresh SAME SHA SOL demo-domain signed source -> production OBS Kit v2 pending queue (no ACK)
        run: |
          set -euo pipefail
          bash scripts/ci/record.sh genuine-fresh-solana-domain-obs-v2 node --test scripts/ci/a0-demo-domain-kit-v2.mjs
          test -s ci-artifacts/observer-fresh-domain-reviewed-v2-original-signed-localnet.json
          (cd ci-artifacts && sha256sum --check observer-fresh-domain-reviewed-v2-original-signed-localnet.json.sha256)
      # OBS #57 permits archived RPC injection ONLY inside Node's test-runner child;
      # run the original replay under that context, never relax production OBS.
      - name: Test audit-only execution source binding and generate NEW DNA build input (no install/write)
        env:
          A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --check demo/a0-execution-bound-dna.mjs
          node --test demo/a0-execution-bound-dna.test.mjs
          node demo/a0-execution-bound-dna.mjs --out ci-artifacts/a0-execution-bound-dna.yaml
          (cd ci-artifacts && sha256sum --check a0-execution-bound-dna.yaml.sha256)
          (cd ci-artifacts && sha256sum --check a0-execution-bound-dna.report.json.sha256)
          # Source template is source-owned and MUST stay byte-identical.
          node scripts/ci/verify-integration-provenance.mjs
      # CI-owned preauthorization stage runner repeats the genuine same-SHA
      # source-owned Kit replay. Its seven-stage report is NOT a Holochain ACK
      # and stage 4 stays closed absent independent exact-tuple approval.
      - name: Execute fail-closed A1 seven-stage preauthorization runner (NO Holochain write)
        if: always()
        env:
          A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test demo/a0-preauthorization-runner.test.mjs
          node demo/a0-preauthorization-runner.mjs --out ci-artifacts/a0-preauthorization-seven-stage.json
          (cd ci-artifacts && sha256sum --check a0-preauthorization-seven-stage.json.sha256)
      - name: Replay real finalized account snapshots into OBS and quarantine-only shadow mode
        run: bash scripts/ci/record.sh real-snapshot-shadow-handoff node --test tests/integration/s0-shadow-handoff.test.mjs
      - name: Emit SHA-bound A0 BLOCKED machine inventory even when a prior step fails
        if: always()
        env:
          A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-artifacts
          node demo/a0-evidence-summary.mjs --out ci-artifacts/a0-evidence-summary.json
          sha256sum ci-artifacts/a0-evidence-summary.json | tee ci-artifacts/a0-evidence-summary.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-cross-lane-js
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  rave-rust:
    name: RAVE 0.15.0 real crate tests (NOT deployed DNA)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Never test an automatically advanced PR merge ref as an alleged frozen snapshot.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust
        run: |
          source scripts/ci/toolchain.env
          bash scripts/ci/record.sh rave-rust-setup rustup toolchain install "$RUST_VERSION" --profile minimal
          rustc --version
      - name: Verify downloaded published rave_engine 0.15.0 crate integrity
        run: bash scripts/ci/record.sh rave-crate-integrity bash tests/holochain/rave-engine/verify-crate.sh
      - name: Run actual published-crate API harness outside root workspace
        run: |
          set -euo pipefail
          test -s tests/holochain/rave-engine/Cargo.toml
          mkdir -p ci-artifacts
          tmp="$(mktemp -d -t rave-engine-s0.XXXXXXXX)"
          trap 'rm -rf -- "$tmp"' EXIT
          cp -R tests/holochain/rave-engine/. "$tmp/"
          bash scripts/ci/record.sh rave-rust-tests cargo test --locked --manifest-path "$tmp/Cargo.toml" --all-targets
          test -s "$tmp/Cargo.lock"
          cp "$tmp/Cargo.lock" ci-artifacts/rave-engine-Cargo.lock
          sha256sum ci-artifacts/rave-engine-Cargo.lock | tee ci-artifacts/rave-engine-lock.sha256
          bash scripts/ci/record.sh rave-lock-integrity bash scripts/ci/check-lock-digest.sh rave ci-artifacts/rave-engine-Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-rave-rust
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  solana-lifecycle:
    name: Real local-validator Anchor lifecycle (SOL runner; disposable only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      NO_DNA: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Never test an automatically advanced PR merge ref as an alleged frozen snapshot.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Install host Rust 1.95.0
        run: |
          source scripts/ci/toolchain.env
          bash scripts/ci/record.sh sol-rust-setup rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Install SHA256-pinned Agave 4.1.2 archive (no remote installer)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/solana" ci-artifacts
          archive="$(mktemp -t agave-4.1.2.XXXXXXXX.tar.bz2)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$archive"
          printf '%s  %s\n' '5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770' "$archive" | sha256sum --check
          while IFS= read -r entry; do
            case "$entry" in solana-release/*) ;; *) echo "UNSAFE_AGAVE_ARCHIVE_PATH: $entry" >&2; exit 1;; esac
          done < <(tar -tjf "$archive")
          tar -xjf "$archive" -C "$HOME/.local/share/solana"
          test -x "$HOME/.local/share/solana/solana-release/bin/solana-test-validator"
          echo "$HOME/.local/share/solana/solana-release/bin" >> "$GITHUB_PATH"
          sha256sum "$HOME/.local/share/solana/solana-release/bin/solana" > ci-artifacts/agave-executable.sha256
      - name: Install pinned Anchor CLI from tagged lockfile
        run: |
          source scripts/ci/toolchain.env
          bash scripts/ci/record.sh anchor-setup cargo install --git https://github.com/otter-sec/anchor --rev "8d9d1488d9b8af41b266d7513eea2e668adf15a2" anchor-cli --locked
      - name: Capture pinned runtime versions
        run: bash scripts/ci/record.sh integration-versions bash scripts/ci/tool-versions.sh
      - name: Run real localnet build, deploy and transaction assertions (SOL-owned script)
        run: bash scripts/ci/record.sh localnet-build bash tests/solana/localnet-build.sh
      - name: Record public artifact SHA and build status (never keys)
        if: always()
        run: |
          mkdir -p ci-artifacts
          if [ -s target/idl/deposit_prototype.json ]; then
            sha256sum target/idl/deposit_prototype.json | tee ci-artifacts/localnet-idl.sha256
          else
            echo "NOT GENERATED: localnet IDL" | tee ci-artifacts/localnet-idl.status
          fi
          if [ -s target/deploy/deposit_prototype.so ]; then
            sha256sum target/deploy/deposit_prototype.so | tee ci-artifacts/localnet-program.sha256
          else
            echo "NOT GENERATED: SBPF program binary" | tee ci-artifacts/localnet-program.status
          fi
          if [ -s Cargo.lock ]; then
            sha256sum Cargo.lock | tee ci-artifacts/localnet-Cargo-lock.sha256
            cp Cargo.lock ci-artifacts/localnet-Cargo.lock
          fi
          if [ -s tests/solana/package-lock.json ]; then
            sha256sum tests/solana/package-lock.json | tee ci-artifacts/solana-package-lock.sha256
            cp tests/solana/package-lock.json ci-artifacts/solana-package-lock.json
          fi
      - name: Retain exact checked-out SHA and public-only file manifest (including partial witnesses)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/localnet-evidence
          git rev-parse HEAD > target/localnet-evidence/source-commit.txt
          (cd target/localnet-evidence &&
            find . -maxdepth 1 -type f \( -name '*.rpc.json' -o -name 'sprint1-*-transactions.json' -o -name '*-receipt.json' -o -name '*-receipts.json' -o -name 'sprint1-two-wallets-live.json' -o -name 'sprint1-initializer-capture.json' -o -name 'sprint1-u64-refunded.json' -o -name 'restart-state.json' -o -name 'restart-after.json' -o -name 'demo-source-domain.json' -o -name 'demo-domain-*.json' -o -name '*.txt' -o -name 'tracked-*-sync.sha256' -o -name 'anchor-keys-sync.patch' -o -name 'build-inputs.sha256' -o -name 'cargo-lock.sha256' -o -name 'restart-validator-*.log' -o -name 'unexpected-onchain-*.json' \) -print0 |
            sort -z | xargs -0 -r sha256sum) > target/localnet-evidence/evidence-manifest.sha256
      - name: Verify exact published workspace and Solana Node graphs
        run: |
          bash scripts/ci/record.sh sol-workspace-lock bash scripts/ci/check-lock-digest.sh workspace Cargo.lock
          bash scripts/ci/record.sh sol-node-lock bash scripts/ci/check-lock-digest.sh solana tests/solana/package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-localnet-evidence-NO-KEYS
          path: |
            ci-artifacts/
            target/idl/deposit_prototype.json
            target/deploy/deposit_prototype.so
            target/localnet-evidence/*.txt
            target/localnet-evidence/evidence-manifest.sha256
            target/localnet-evidence/tracked-pre-sync.sha256
            target/localnet-evidence/tracked-post-sync.sha256
            target/localnet-evidence/anchor-keys-sync.patch
            target/localnet-evidence/anchor-keys-sync-tracked-changes.txt
            target/localnet-evidence/build-inputs.sha256
            target/localnet-evidence/cargo-lock.sha256
            target/localnet-evidence/active-receipt.json
            target/localnet-evidence/refunded-receipt.json
            target/localnet-evidence/two-active-receipts.json
            target/localnet-evidence/two-refunded-receipts.json
            # SOL's verifier requires these genuine finalized account
            # snapshots in the three isolated local-validator scenarios.
            # Do not upload unreviewed secrets or use broad JSON globs.
            target/localnet-evidence/sprint1-two-wallets-live.json
            target/localnet-evidence/sprint1-initializer-capture.json
            target/localnet-evidence/sprint1-u64-refunded.json
            target/localnet-evidence/restart-state.json
            target/localnet-evidence/restart-after.json
            target/localnet-evidence/demo-source-domain.json
            target/localnet-evidence/demo-domain-active-receipt.json
            target/localnet-evidence/demo-domain-refunded-receipt.json
            # Captured PUBLIC localhost Solana JSON-RPC, no keypairs or ledger data.
            target/localnet-evidence/*.rpc.json
            target/localnet-evidence/sprint1-*-transactions.json
            # Source-owned SOL diagnostics include public instruction bytes,
            # ordered account addresses and execution logs but never keys.
            # Preserve on unexpected on-chain failure without pretending PASS.
            target/localnet-evidence/unexpected-onchain-*.json
            target/localnet-evidence/restart-validator-before.log
            target/localnet-evidence/restart-validator-after.log
          if-no-files-found: error
          retention-days: 14

  # A1 source execution and Observer Kit replay are prerequisites: unlike the
  # standalone A4 archived-source build, this uses only fresh same-run evidence.
  source-bound-own-dna-build:
    name: Real SOURCE-BOUND own DNA locked build (NO SIGNING OR GRANT)
    needs: [cross-lane-js]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-cross-lane-js
          path: ci-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-localnet-evidence-NO-KEYS
          path: .
      - name: Prove same-run original signed source and regenerated YAML BEFORE checking build locks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$A0_EXPECTED_SHA"
          printf '%s\n' "$A0_EXPECTED_SHA" > ci-artifacts/build-checkout.sha
          test "$(cat target/localnet-evidence/source-commit.txt)" = "$A0_EXPECTED_SHA"
          test -s ci-artifacts/a0-execution-bound-dna.yaml
          test -s ci-artifacts/a0-execution-bound-dna.report.json
          (cd ci-artifacts && sha256sum -c a0-execution-bound-dna.yaml.sha256)
          (cd ci-artifacts && sha256sum -c a0-execution-bound-dna.report.json.sha256)
          (cd target/localnet-evidence && sha256sum -c evidence-manifest.sha256)
          node scripts/ci/verify-integration-provenance.mjs
          # The source producer/consumer and original A4 template checks
          # execute AGAIN here; never trust an unauthenticated YAML label.
          node demo/a0-execution-bound-dna.mjs --out ci-artifacts/a0-recomputed-bound-dna.yaml
          cmp ci-artifacts/a0-execution-bound-dna.yaml ci-artifacts/a0-recomputed-bound-dna.yaml
          cmp ci-artifacts/a0-execution-bound-dna.report.json ci-artifacts/a0-recomputed-bound-dna.report.json
      - name: Fail closed without BOTH reviewed A4 Cargo.lock graphs; materialize only in throwaway checkout
        run: |
          set -euo pipefail
          for lock in holochain/demo/Cargo.lock holochain/demo/ham-adapter/Cargo.lock; do
            if [[ ! -s "$lock" ]] || ! git ls-files --error-unmatch -- "$lock" >/dev/null 2>&1; then
              echo "BLOCKED_A4_REVIEWED_LOCK_ABSENT: $lock" | tee ci-artifacts/a0-source-bound-build-blocker.txt
              exit 3
            fi
            sha256sum "$lock" | tee -a ci-artifacts/a0-source-bound-locks.sha256
          done
          cp holochain/demo/dna.yaml ci-artifacts/a0-original-checked-in-a4-dna.yaml
          cp ci-artifacts/a0-execution-bound-dna.yaml holochain/demo/dna.yaml
          cmp ci-artifacts/a0-execution-bound-dna.yaml holochain/demo/dna.yaml
          git diff -- holochain/demo/dna.yaml > ci-artifacts/a0-ephemeral-dna-diff.patch
          test -s ci-artifacts/a0-ephemeral-dna-diff.patch
          echo 'EPHEMERAL_ONLY_SOURCE_PROJECTION__NO_GIT_COMMIT__NO_ZOME_CALL' > ci-artifacts/a0-build-policy.txt
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
      - name: Compile native HAM and own DNA WASMs and pack actual Holochain 0.7.1 bundles
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          rustc +1.95.0 -Vv | tee ci-artifacts/a0-locked-rust-version.log
          nix develop 'github:holochain/holonix/a6cdfbd31afd2094b7ccc9b3bd7cf9442ec055da' --command \
            bash holochain/demo/build.sh 2>&1 | tee ci-artifacts/a0-real-source-bound-build.log
          test -s holochain/demo/demo-build-dna-hash.txt
          test -s holochain/demo/demo-build-artifacts.sha256
          (cd holochain/demo && sha256sum -c demo-build-artifacts.sha256)
          echo 'BUILT_ONLY__NOT_INSTALLED_OR_SIGNED' > ci-artifacts/a0-build-state.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-source-bound-own-dna-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-artifacts/
            holochain/demo/demo-build-dna-hash.txt
            holochain/demo/demo-build-artifacts.sha256
            holochain/demo/holochain_solana_audit_demo.dna
            holochain/demo/holochain_solana_audit_demo.happ
            holochain/demo/ham-adapter/target/release/solana-audit-ham-adapter
            holochain/demo/target/wasm32-unknown-unknown/release/solana_audit_integrity.wasm
            holochain/demo/target/wasm32-unknown-unknown/release/solana_audit.wasm
          if-no-files-found: warn
          retention-days: 14

  source-bound-own-dna-install-readonly:
    name: Actual own DNA conductor install and verified CellId (NO ZOME CALL)
    needs: [source-bound-own-dna-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      A0_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-source-bound-own-dna-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Bind actual compiled DNA/hApp to the exact source and both verified locks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$A0_EXPECTED_SHA"
          test "$(cat ci-artifacts/build-checkout.sha)" = "$A0_EXPECTED_SHA"
          test -s ci-artifacts/a0-execution-bound-dna.yaml
          (cd ci-artifacts && sha256sum --check a0-execution-bound-dna.yaml.sha256)
          test -s holochain/demo/demo-build-dna-hash.txt
          test -s holochain/demo/demo-build-artifacts.sha256
          (cd holochain/demo && sha256sum --check demo-build-artifacts.sha256)
          test -s holochain/demo/holochain_solana_audit_demo.happ
          test -s holochain/demo/holochain_solana_audit_demo.dna
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org https://holochain-ci.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
      - name: Install our source-bound DNA on disposable real conductor and admin-read CellId
        run: |
          set -euo pipefail
          nix develop 'github:holochain/holonix/a6cdfbd31afd2094b7ccc9b3bd7cf9442ec055da' --command \
            bash scripts/ci/a0-own-dna-install-readonly.sh \
            holochain/demo/holochain_solana_audit_demo.happ \
            holochain/demo/holochain_solana_audit_demo.dna \
            ci-artifacts/source-bound-conductor
          test -s ci-artifacts/source-bound-conductor/own-dna-install-readonly.json
          echo 'OWN_DNA_INSTALLED_READONLY__EXTERNAL_LAIR_AND_A5_CALL_APPROVAL_STILL_BLOCKED'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-source-bound-own-dna-readonly-install-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-artifacts/source-bound-conductor/
            ci-artifacts/build-checkout.sha
            ci-artifacts/a0-execution-bound-dna.yaml.sha256
          if-no-files-found: warn
          retention-days: 14
