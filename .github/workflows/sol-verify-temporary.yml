# TEMPORARY, SOL-owned validator verification on its own source branch.
# This workflow never changes CI's integration branch; it uploads public-only evidence.
# Permanent workflows are owned by the CI lane (PR #32).
name: SOL disposable localnet verification (temporary)
on:
  push:
    branches:
      - 'agent/sol/7-anchor-build'
      - 'claude/solana-independent-fix'
      - 'agent/sol/sec38-hardening-20261114'
      - 'agent/sol/sec38-attribution-review-20261114'
      - 'agent/sol/sec38-3-4-remediation-20261114'
      - 'agent/sol/12-demo-source-domain-handoff-20261114'
    paths:
      - '.github/workflows/sol-verify-temporary.yml'
      - 'rust-toolchain.toml'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'programs/**'
      - 'tests/solana/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Actual Rust Anchor SBPF and validator deposit-refund
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NO_DNA: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Fail-fast independent signed-message and tamper syntax gate
        run: |
          node --check tests/solana/signed-message.mjs
          node --check tests/solana/verify-witness-bundle.mjs
          node --check tests/solana/verify-witness-tamper.mjs
          node --test tests/solana/signed-message-fixtures.test.mjs
          node --test tests/solana/confirmation-recovery.test.mjs
          node --check tests/solana/demo-scope.mjs
          node --check tests/solana/verify-demo-domain.mjs
          node --check tests/solana/verify-demo-domain-tamper.mjs
          node --check tests/solana/integration.test.mjs
          node --test tests/solana/demo-scope.test.mjs
      - name: Install exact Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc -V
      - name: Verify publisher-pinned Agave v4.1.2 Linux archive BEFORE using binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/localnet-evidence "$HOME/.local/share/solana"
          # Independently RECORD and REVIEW this expected digest against the
          # upstream release metadata before accepting new code. The GitHub
          # publisher's release checksum is NOT an independent code audit.
          # https://api.github.com/repos/anza-xyz/agave/releases/tags/v4.1.2
          expected=5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
          archive=/tmp/solana-release-4.1.2-x86_64-unknown-linux-gnu.tar.bz2
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --retry 3 \
            https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            -o "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          printf '%s  %s\n' "$expected" 'solana-release-v4.1.2-linux.tar.bz2' \
            > target/localnet-evidence/agave-release-expected-sha256.txt
          sha256sum "$archive" > target/localnet-evidence/agave-release-actual-sha256.txt
          # Verify archive's root paths before unpacking. No downloaded shell
          # installer is executed, and no downloaded binary runs before hashing.
          while IFS= read -r entry; do
            case "$entry" in
              solana-release/*) ;;
              *) printf 'Unsafe archive path: %s\n' "$entry" >&2; exit 1 ;;
            esac
          done < <(tar -tjf "$archive")
          tar -xjf "$archive" -C "$HOME/.local/share/solana"
          test -x "$HOME/.local/share/solana/solana-release/bin/solana"
          test -x "$HOME/.local/share/solana/solana-release/bin/solana-test-validator"
          echo "$HOME/.local/share/solana/solana-release/bin" >> "$GITHUB_PATH"
          rm -f "$archive"
      - name: Install Anchor CLI from reviewed signed v1.2.2 commit
        run: |
          # Signed annotated v1.2.2 tag object: 7f9c7c83b5652e92ec6d509e02c0ad4554b6624c
          # GitHub-verified annotated tag target: 8d9d1488d9b8af41b266d7513eea2e668adf15a2
          cargo install --git https://github.com/otter-sec/anchor \
            --rev 8d9d1488d9b8af41b266d7513eea2e668adf15a2 anchor-cli --locked
          anchor --version
          sha256sum "$(command -v anchor)" \
            > target/localnet-evidence/anchor-executable-sha256.txt
      - name: Compile Rust host and run real SBPF/validator test lifecycle
        run: |
          mkdir -p target/localnet-evidence
          set -o pipefail
          cargo check --locked --workspace --all-targets 2>&1 | tee target/localnet-evidence/cargo-check.log
          bash tests/solana/localnet-build.sh 2>&1 | tee target/localnet-evidence/localnet-build.log
      - name: Collect status, hashes and tool versions without keys
        if: always()
        run: |
          mkdir -p target/localnet-evidence
          {
            (rustc -V || true)
            (cargo -V || true)
            (solana --version || true)
            (anchor --version || true)
            (node --version || true)
          } > target/localnet-evidence/versions.log 2>&1
          {
            for tool in solana solana-test-validator anchor node; do
              if command -v "$tool" >/dev/null; then
                sha256sum "$(command -v "$tool")"
              fi
            done
            if command -v rustup >/dev/null; then
              sha256sum "$(rustup which rustc)" "$(rustup which cargo)"
            fi
          } > target/localnet-evidence/toolchain-executables-sha256.txt
          git rev-parse HEAD > target/localnet-evidence/source-commit.txt
          if [ -s target/idl/deposit_prototype.json ]; then
            sha256sum target/idl/deposit_prototype.json >> target/localnet-evidence/artifacts-sha256.txt
          else
            echo 'IDL not generated' > target/localnet-evidence/idl-status.txt
          fi
          if [ -s target/deploy/deposit_prototype.so ]; then
            sha256sum target/deploy/deposit_prototype.so >> target/localnet-evidence/artifacts-sha256.txt
          else
            echo 'SBPF binary not generated' > target/localnet-evidence/sbpf-status.txt
          fi
          # Hash manifest of every public evidence file (keys never enter this dir).
          (cd target/localnet-evidence && find . -type f ! -name evidence-manifest.sha256 -print0 \
            | sort -z | xargs -0 sha256sum) > target/localnet-evidence/evidence-manifest.sha256
      - name: Upload public-only logs and generated IDL; never keypairs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solana-localnet-verification-evidence
          path: |
            target/localnet-evidence/
            target/idl/deposit_prototype.json
            target/deploy/deposit_prototype.so
          if-no-files-found: error
          retention-days: 14
