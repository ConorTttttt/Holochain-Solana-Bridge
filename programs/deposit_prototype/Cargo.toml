[package]
name = "deposit_prototype"
version = "0.1.0"
edition = "2021"
description = "LOCALNET ONLY: refundable SPL deposit prototype; no Holochain crediting"

[lib]
crate-type = ["cdylib", "lib"]
name = "deposit_prototype"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", features = ["token"] }
