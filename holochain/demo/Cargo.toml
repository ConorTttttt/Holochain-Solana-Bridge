[workspace]
resolver = "2"
members = ["integrity", "coordinator"]
# Native HAM/Lair client has a separate lock/target; exclude from WASM resolver.
exclude = ["ham-adapter"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
hdi = "=0.8.1"
hdk = "=0.7.1"
anyhow = "1"
