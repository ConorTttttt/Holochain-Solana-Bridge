# Standalone native HAM/Lair workspace: the repository root is a separate
# Solana workspace and must not absorb this manifest during Cargo resolution.
[workspace]
resolver = "2"

[package]
name = "solana-audit-ham-adapter"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ham = { git = "https://github.com/unytco/ham", rev = "fbb4b6eb8a79a507e9453b709ed00f15c5618fb4" }
holochain_client = "=0.9.1"
holo_hash = "=0.7.1"
tokio = { version = "1", features = ["full"] }
