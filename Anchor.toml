# Development placeholder: generate a disposable localnet program keypair in target/deploy,
# then run anchor keys sync locally. Never commit the generated private key.
[toolchain]
anchor_version = "1.2.2"
solana_version = "=4.1.2"
package_manager = "npm"

[programs.localnet]
deposit_prototype = "Fg6PaFpoGXkYsidMpWxTWqYhcuud1Qpw7wC6G7n5dFS"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/deposit_prototype"]

[scripts]
test = "cd tests/solana && npm run test:integration"
